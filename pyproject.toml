[project]
name = "gemma4-performance-evaluation"
version = "0.1.0"
description = "Serving-performance evaluation of Gemma 4 on a single H100 NVL with vLLM 0.32"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "aiohttp>=3.14.5",
    "datasets>=5.1.0",
    "huggingface-hub>=2.3.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy",
    "pandas>=3.1.0",
    "vllm==0.32.0",
    "transformers==5.19.0",
]

[tool.uv]
package = false
# The measurements were taken on Linux x86_64 (H100 NVL, CUDA 13).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
